[package]
name = "vmt-local-agent"
version = "0.6.2"
edition = "2024"
default-run = "vmt-local-agent"
description = "A native desktop coding workbench for local Ollama models"
license = "MIT"

[[bin]]
name = "vmt-agent-check"
path = "src/check.rs"

[dependencies]
anyhow = "1"
arboard = { version = "=3.7.0", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "x11", "wayland"] }
ignore = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.18"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["deserialize"] }
similar = "3.2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true

