name: Tool packs
on:
  push:
    branches: [main, 'codex/**']
    paths: ['tool-packs/**', 'src/**', 'scripts/**', 'skills/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/tool-packs.yml']
  pull_request:
    paths: ['tool-packs/**', 'src/**', 'scripts/**', 'skills/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/tool-packs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tool-packs/office/requirements.txt -r tool-packs/pdf/requirements.txt -r tool-packs/visual/requirements.txt
      - run: python -m pip install psutil==7.0.0
      - run: python -B tool-packs/check_packs.py
      - run: python -B -m unittest discover -s tool-packs -p "test_*.py" -v
