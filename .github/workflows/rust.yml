name: Rust validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with lint components
        run: rustup component add clippy rustfmt
      - name: Check compilation
        run: cargo check --locked
      - name: Run library and broker integration tests
        run: cargo test --locked
      - name: Clippy all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install isolated design test dependencies
        run: |
          python -m pip install --only-binary=:all: -r scripts/design-requirements.txt
      - name: Validate design worker boundaries
        run: python -B scripts/test_design_runner.py -v
      - name: Run creative artifact benchmarks
        run: python -B scripts/creative_benchmark.py --output creative-benchmark-results
      - name: Upload creative benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-benchmark-results
          path: creative-benchmark-results/
          if-no-files-found: ignore
